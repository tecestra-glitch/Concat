name: Secret scan

# TruffleHog over the commits of every push and pull request, for the whole
# repository. This file has no path filter on purpose: fronteira-fx.yml runs
# only on changes under fronteira-fx/, and a push that touches only the Rust
# app has to be scanned as well.
#
# --only-verified reports only secrets TruffleHog could confirm are live, and a
# verified secret fails the job. On push the action scans from
# github.event.before to github.event.after; on pull_request, from the base to
# the head of the pull request; started by hand, it scans the whole history.
#
# The action is a wrapper: the scanner it runs is the Docker image named by
# its `version` input, which defaults to `latest` whatever commit the action
# is pinned to. So the version is passed explicitly, and it is the one the
# hooks in fronteira-fx/.husky use before each commit and push
# (TRUFFLEHOG_VERSION in scan-secrets.sh; the `hooks` job of fronteira-fx.yml
# fails when the two drift apart). The hooks depend on the developer's
# machine; this job is the second barrier, not the only one.
#
# Pinned to a commit, with the tag in a comment, like every other action in
# this repository. Dependabot moves both together (.github/dependabot.yml);
# the `version` input below is bumped by hand, together with the hooks.

on:
  push:
  pull_request:
  workflow_dispatch:

# Read access to the repository and nothing else.
permissions:
  contents: read

# Only a pull request's run is superseded by the next push to it; a run on a
# branch is the record of whether that push was clean.
concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  trufflehog:
    name: TruffleHog
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # The scan reads the commits between the two ends of the range, so the
      # clone needs the whole history.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: trufflesecurity/trufflehog@31ce31ee1abbcc7dc8eee5764c17121c3044c8b2 # v3.99.7
        with:
          # The scanner's own version (the image tag has no "v"). Keep it equal to
          # TRUFFLEHOG_VERSION in fronteira-fx/.husky/scan-secrets.sh.
          version: "3.99.7"
          extra_args: --only-verified
